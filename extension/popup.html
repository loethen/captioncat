<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="app.name">CaptionCat</title><link rel="stylesheet" href="popup.css"></head>
<body class="popup">
  <header><div class="brand"><img class="logo" src="icons/32.png" alt=""><div><h1 class="wordmark" aria-label="CaptionCat" data-i18n-attr="aria-label:app.name"><span data-i18n="app.nameStart">Caption</span><span class="wordmark-cat" data-i18n="app.nameEnd">Cat</span></h1><p class="tagline"><span data-i18n="app.tagline">Here to watch with you</span></p></div></div><div class="header-tools"><select id="ui-language" aria-label="Interface language" data-i18n-attr="aria-label:language.label"></select></div></header>
  <main>
    <div class="preview" id="preview"><div class="preview-caption" id="preview-caption"><div class="preview-line"><span>Captions with a little company,</span></div><div class="preview-line"><span>and a little curiosity.</span></div></div></div>
    <section class="card" aria-label="Caption appearance" data-i18n-attr="aria-label:skins.heading">
      <label class="field"><span data-i18n="skins.label">Caption skin</span><select id="skin"></select></label>
      <label class="field"><span data-i18n="characters.label">Caption character</span><select id="character"></select></label>
      <label class="field" id="activity-control" hidden><span><span data-i18n="activity.label">Activity</span> <output class="level-name" id="activity-name"></output></span><input id="activity" class="level-slider" type="range" min="0" max="2" step="1" aria-label="Activity" data-i18n-attr="aria-label:activity.label"></label>
      <label class="field" id="preview-mascot-control" hidden><span data-i18n="preview.label">Preview action</span><select id="preview-state"></select></label>
    </section>
    <p class="hint"><span data-i18n="popup.hintStart">Open a YouTube video and </span><strong class="hint-key"><span data-i18n="popup.hintKey">turn on captions</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10.5 10.2a2.5 2.5 0 1 0 0 3.6M16.8 10.2a2.5 2.5 0 1 0 0 3.6"/></svg></strong><span data-i18n="popup.hintEnd"> to get started.</span></p>
    <div class="popup-footer">
      <p class="footnote" data-i18n="skins.shortcut">Alt + Shift + S switches the caption skin</p>
      <button class="icon-button" id="open-options" aria-label="Settings" title="Settings" data-i18n-attr="aria-label:popup.openOptions;title:popup.openOptions"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <p class="status" id="status" role="status"></p>
  </main>
  <script src="popup.js"></script>
</body></html>
