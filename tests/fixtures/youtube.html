<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Caption integration fixture - YouTube</title>
<style>
  body{margin:0;padding:40px;background:#fafafa;font:15px system-ui;color:#292929}h1{font-size:20px;font-weight:500}#movie_player{position:relative;width:900px;height:506px;background:#282c31;overflow:hidden;color:white}video{width:100%;height:100%;object-fit:cover}.ytp-caption-window-container{position:absolute;inset:0;pointer-events:none}.caption-window{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;font-size:24px}.ytp-caption-segment{background:#111;color:white;font-size:24px;padding:5px 8px}.scene{position:absolute;top:45%;left:0;right:0;text-align:center;pointer-events:none;color:#9fa6ad;font:24px system-ui}.controls{position:absolute;bottom:12px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#bbb}.controls button{border:1px solid #777;background:transparent;color:white;padding:5px 10px;border-radius:4px}#movie_player:fullscreen{width:100%;height:100%;background:#282c31}
</style></head><body><h1>Caption integration fixture</h1><div id="movie_player"><video muted autoplay></video><div class="scene">Subtitle companion · browser check</div><div class="ytp-caption-window-container"><div class="caption-window"><div class="captions-text"><div class="caption-visual-line"><span class="ytp-caption-segment">A little curiosity brings discovery.</span></div></div></div></div><div class="controls"><span>▶ &nbsp; 00:12 / 03:40</span><button id="fullscreen">Fullscreen</button></div></div>
<script>
  const canvas=document.createElement('canvas');canvas.width=900;canvas.height=506;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#282c31';ctx.fillRect(0,0,900,506);
  const video=document.querySelector('video');video.srcObject=canvas.captureStream(1);video.play();
  window.playCount=0;window.pauseCount=0;video.addEventListener('play',()=>window.playCount++);video.addEventListener('pause',()=>window.pauseCount++);
  document.querySelector('#fullscreen').addEventListener('click',()=>document.querySelector('#movie_player').requestFullscreen());
  document.querySelector('#movie_player').addEventListener('click',event=>{if(event.target.closest('#fullscreen'))return;window.playerClickCount=(window.playerClickCount||0)+1;});
</script></body></html>
